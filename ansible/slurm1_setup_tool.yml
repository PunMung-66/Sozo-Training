---
- name: Set up Git, uv, and DVC on Slurm
  hosts: server
  gather_facts: true

  tasks:
    - name: Set uv paths
      ansible.builtin.set_fact:
        uv_bin: "{{ ansible_env.HOME }}/.local/bin/uv"
        uv_dir: "{{ ansible_env.HOME }}/.local/bin"

    - name: Install uv if missing
      ansible.builtin.shell: |
        set -euo pipefail
        curl -LsSf https://astral.sh/uv/install.sh | sh
      args:
        executable: /bin/bash
        creates: "{{ uv_dir }}/uv"

    - name: Ensure local bin is on PATH in .bashrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        mode: "0644"
        state: present

    - name: Check whether DVC is already installed
      ansible.builtin.command:
        argv:
          - "{{ uv_dir }}/dvc"
          - "--version"
      register: dvc_check
      changed_when: false
      failed_when: false

    - name: Install DVC with gdrive support
      ansible.builtin.command:
        argv:
          - "{{ uv_bin }}"
          - tool
          - install
          - --with
          - dvc-gdrive
          - --with
          - pyopenssl>=24.3.0
          - --with
          - cryptography>=43
          - dvc
      when: dvc_check.rc != 0
      changed_when: "'dvc' not in dvc_check.stdout"

    - name: Check whether Git is already installed
      ansible.builtin.command:
        argv:
          - git
          - --version
      register: git_check
      changed_when: false
      failed_when: false

    - name: Install Git when missing
      become: true
      ansible.builtin.package:
        name: git
        state: present
      when: git_check.rc != 0

    - name: Ensure local bin is on PATH in .profile
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.profile"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        mode: "0644"
        state: present

    - name: Verify uv installation
      ansible.builtin.command:
        argv:
          - "{{ uv_bin }}"
          - "--version"
      register: uv_version
      changed_when: false

    - name: Verify DVC installation
      ansible.builtin.command:
        argv:
          - "{{ uv_dir }}/dvc"
          - "--version"
      register: dvc_version
      changed_when: false

    - name: Verify Git installation
      ansible.builtin.command:
        argv:
          - git
          - --version
      register: git_version
      changed_when: false


    - name: Show installed versions
      ansible.builtin.debug:
        msg:
          - "uv is ready: {{ uv_version.stdout }}"
          - "DVC is ready: {{ dvc_version.stdout }}"
          - "Git is ready: {{ git_version.stdout }}"

    - name: Show PATH setup
      ansible.builtin.debug:
        msg: "Added {{ uv_dir }} to shell startup files. Reconnect SSH or reload your shell to use uv directly."

    - name: Clone project repository
      ansible.builtin.git:
        repo: "{{ github_repo }}"
        dest: "{{ project_path }}/{{ repo_name }}"
        version: "{{ repo_branch | default('main') }}"
        update: true
        force: true

    - name: Create venv by uv
      ansible.builtin.command:
        argv:
          - "{{ uv_bin }}"
          - venv
          - "{{ project_path }}/{{ repo_name }}/venv"
          - --python
          - "3.12"
          - --seed
      args:
        creates: "{{ project_path }}/{{ repo_name }}/venv/bin/python"

    - name: Add Google Client ID and Secret to DVC config
      ansible.builtin.command:
        argv:
          - "{{ uv_dir }}/dvc"
          - remote
          - modify
          - --local
          - gdrive
          - "{{ item.var }}"
          - "{{ item.value }}"
      args:
        chdir: "{{ project_path }}/{{ repo_name }}"
      loop:
        - var: gdrive_client_id
          value: "{{ google_client_id }}"
        - var: gdrive_client_secret
          value: "{{ google_client_secret }}"
      changed_when: false

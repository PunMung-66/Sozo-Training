---
- name: Set up project on Slurm
  hosts: server
  tasks:
    - name: Set uv paths
      ansible.builtin.set_fact:
        dvc_bin: "{{ ansible_env.HOME }}/.local/bin/dvc"

    - name: Check whether DVC is installed
      ansible.builtin.command:
        argv:
          - "{{ dvc_bin }}"
          - --version
      register: dvc_check
      changed_when: false
      failed_when: false

    - name: If DVC is not installed, run setup playbook to install DVC
      ansible.builtin.fail:
        msg: "DVC is not installed. Please run slurm1_setup_tool.yml to install DVC."
      when: dvc_check.rc != 0

    - name: Pull datasets using DVC
      ansible.builtin.command:
        argv:
          - "{{ dvc_bin }}"
          - pull
      args:
        chdir: "{{ project_path }}/{{ repo_name }}"
      changed_when: false
      when: dvc_check.rc == 0

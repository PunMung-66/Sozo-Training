---
- name: Set up project on Slurm
  hosts: server
  tasks:
    - name: Check whether GIT is installed
      ansible.builtin.command:
        argv:
          - git
          - --version
      register: git_check
      changed_when: false
      failed_when: false

    - name: If GIT is not installed, fail the playbook
      ansible.builtin.fail:
        msg: "GIT is not installed. Please install GIT to proceed."
      when: git_check.rc != 0

    - name: Check project directory
      ansible.builtin.stat:
        path: "{{ project_path }}/{{ repo_name }}"
      register: project_dir

    - name: Fail if project directory is missing
      ansible.builtin.fail:
        msg: "Project directory does not exist."
      when: not project_dir.stat.exists

    - name: Fetch and checkout repository branch
      ansible.builtin.git:
        repo: "{{ github_repo }}"
        dest: "{{ project_path }}/{{ repo_name }}"
        version: "{{ repo_branch | default('main') }}"
        update: true
        force: true
